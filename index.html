<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Var Mısın Yok Musun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        :root {
            --gold: #ffd700;
            --blue-prize: #2196f3;
            --yellow-prize: #ffc107;
            --red-prize: #f44336;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1a237e 0%, #0d1442 100%);
            color: white;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #splash-screen.hidden {
            display: none !important;
        }

        #splash-image {
            width: min(60vw, 60vh, 400px);
            max-width: 90%;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        #progress-container {
            width: min(60vw, 350px);
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            border: 2px solid var(--gold);
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), #ff8f00);
            width: 0%;
            border-radius: 8px;
            transition: width 0.1s linear;
        }

        /* Game */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
        }

        #game-container.show {
            display: flex;
        }

        .game-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 5px;
        }

        .prize-tree-left, .prize-tree-right {
            width: 10%;
            min-width: 50px;
            background: rgba(0,0,0,0.5);
            padding: 5px 2px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            border: 2px solid var(--gold);
            border-radius: 5px;
        }

        .prize-tree-right {
            border-left: 2px solid var(--gold);
        }

        .prize-item {
            padding: 4px 2px;
            border-radius: 3px;
            text-align: center;
            font-weight: 700;
            font-size: 0.65rem;
            white-space: nowrap;
        }

        .prize-item.blue { background: linear-gradient(90deg, var(--blue-prize), #64b5f6); color: #000; }
        .prize-item.yellow { background: linear-gradient(90deg, var(--yellow-prize), #ffe082); color: #000; }
        .prize-item.red { background: linear-gradient(90deg, var(--red-prize), #ef5350); color: #fff; }
        .prize-item.opened { opacity: 0.15; filter: grayscale(100%); }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 5px;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 3px;
        }

        .stage-info {
            background: rgba(255,215,0,0.2);
            padding: 5px 15px;
            border-radius: 12px;
            display: inline-block;
            font-weight: 700;
            border: 2px solid var(--gold);
            font-size: 0.9rem;
        }

        .boxes-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
        }

        .game-box {
            aspect-ratio: 4/3;
            background: linear-gradient(145deg, #283593, #1a237e);
            border: 2px solid var(--gold);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .game-box.player-box {
            background: linear-gradient(145deg, var(--gold), #ff8f00);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        .game-box.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .box-number {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 2px;
        }

        .box-avatar {
            font-size: 1.5rem;
        }

        .game-box.player-box .box-number {
            color: #000;
        }

        .bottom-info {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .info-box {
            text-align: center;
            padding: 6px 12px;
            background: rgba(255,215,0,0.15);
            border-radius: 6px;
            border: 2px solid var(--gold);
            min-width: 80px;
        }

        .info-label {
            font-size: 0.65rem;
            color: #ccc;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 900;
            color: var(--gold);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a237e, #0d1442);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .modal-text {
            font-size: 1.1rem;
            margin: 15px 0;
        }

        .offer-amount {
            font-size: 3rem;
            font-weight: 900;
            color: #4caf50;
            margin: 25px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .btn-yes { background: linear-gradient(135deg, #4caf50, #45a049); color: white; }
        .btn-no { background: linear-gradient(135deg, #f44336, #da190b); color: white; }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 8000;
        }

        @media screen and (orientation: portrait) {
            .game-wrapper { flex-direction: column; }
            .prize-tree-left, .prize-tree-right {
                width: 100%;
                height: 80px;
                flex-direction: row;
            }
            .prize-tree-left { border-bottom: 2px solid var(--gold); border-right: none; order: 1; }
            .prize-tree-right { border-bottom: 2px solid var(--gold); border-left: none; order: 3; }
            .game-area { order: 2; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <img id="splash-image" src="https://github.com/oozata/ozata/blob/main/splach.png?raw=true" alt="Splash">
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- Fireworks -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Game -->
    <div id="game-container">
        <div class="game-wrapper">
            <div class="prize-tree-left" id="prize-tree-left"></div>
            <div class="game-area">
                <div class="header">
                    <h1>📦 VAR MISIN YOK MUSUN 📦</h1>
                    <div class="stage-info" id="stage-info">Kendi kutunuzu seçin!</div>
                </div>
                <div class="boxes-container">
                    <div class="boxes-grid" id="boxes-grid"></div>
                </div>
                <div class="bottom-info">
                    <div class="info-box">
                        <div class="info-label">Son Teklif</div>
                        <div class="info-value" id="last-offer">0 TL</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">KUTUNUZ</div>
                        <div class="info-value" id="player-box-num">?</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Kalan</div>
                        <div class="info-value" id="boxes-remaining">22</div>
                    </div>
                </div>
            </div>
            <div class="prize-tree-right" id="prize-tree-right"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="box-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-box-num">1</div>
            <div class="offer-amount" id="revealed-prize">0 TL</div>
        </div>
    </div>

    <div class="modal" id="banker-modal">
        <div class="modal-content">
            <div class="modal-title">📞 BANKA ARIYOR!</div>
            <div class="modal-text">Size bir teklif sunuyor:</div>
            <div class="offer-amount" id="banker-offer">0 TL</div>
            <div class="modal-buttons">
                <button class="btn btn-yes" onclick="acceptOffer()">VARIM!</button>
                <button class="btn btn-no" onclick="rejectOffer()">YOKUM!</button>
            </div>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div class="modal-content">
            <div class="modal-title" id="result-title">TEBRİKLER!</div>
            <div class="modal-text" id="result-message"></div>
            <div class="offer-amount" id="result-amount">0 TL</div>
            <button class="btn btn-yes" onclick="resetGame()" style="margin-top: 20px;">YENİ OYUN</button>
        </div>
    </div>

    <script>
        // === SPLASH SCREEN ===
        const splashScreen = document.getElementById('splash-screen');
        const progressBar = document.getElementById('progress-bar');
        const splashImg = document.getElementById('splash-image');
        let gameStarted = false;

        function startGameAfterSplash() {
            if (gameStarted) return;
            gameStarted = true;
            
            let progress = 0;
            const duration = 4000;
            const interval = 100;
            
            const timer = setInterval(() => {
                progress += 100 / (duration / interval);
                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        splashScreen.classList.add('hidden');
                        document.getElementById('game-container').style.display = 'flex';
                        initGame();
                    }, 500);
                }
                progressBar.style.width = progress + '%';
            }, interval);
        }

        // Resim yüklendiğinde
        splashImg.onload = function() {
            console.log("Resim yüklendi");
            startGameAfterSplash();
        };

        // Resim yüklenemezse
        splashImg.onerror = function() {
            console.log("Resim yüklenemedi, devam ediliyor");
            setTimeout(startGameAfterSplash, 1000);
        };

        // Güvenlik: 5 saniye sonra mutlaka başla
        setTimeout(() => {
            if (!gameStarted) {
                console.log("Timeout - oyun başlatılıyor");
                startGameAfterSplash();
            }
        }, 5000);

        // === OYUN DEĞİŞKENLERİ ===
        const prizes = [
            1, 5, 10, 25, 50, 100, 250, 500, 1000, 5000, 10000,
            25000, 50000, 100000, 250000, 500000,
            750000, 1000000, 2000000, 3000000, 5000000, 5000000
        ];

        // TÜM 22 EMOJİ - HİÇBİRİ BOŞ DEĞİL!
        const avatars = [
            '😀', '😎', '🤠', '🥳', '🤔', 
            '🧐', '', '🥰', '😘', '🎉', 
            '🤪', '😎', '🤠', '🤗', '🤩', 
            '😇', '🤯', '🤓', '🥸', '🤡', 
            '👻', ''
        ];

        let boxContents = {};
        let playerBox = null;
        let openedBoxes = [];
        let currentStage = 0;
        const stages = [4, 3, 3, 3, 3, 2, 2];
        let openedInCurrentStage = 0;
        let gameActive = false;
        let currentOffer = 0;
        let lastOffer = 0;
        let audioCtx = null;
        let prizeElementMap = {};

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {}
            }
        }

        function playPhoneRing() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = 440;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function playDramSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.value = 80;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function playCelebration() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = 600;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        function playDisappointment() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = 300;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        // Havai fişek
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff', '#fa0', '#fff'];
                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 * i) / 30;
                    const v = 2 + Math.random() * 2;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * v,
                        vy: Math.sin(angle) * v,
                        life: 1,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }
            update() {
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.life -= 0.02;
                });
                this.particles = this.particles.filter(p => p.life > 0);
            }
            draw(ctx) {
                this.particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        let fireworks = [];
        let fireworksActive = false;

        function startFireworks() {
            fireworksActive = true;
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            function animate() {
                if (!fireworksActive) return;
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.05) {
                    fireworks.push(new Firework(Math.random() * canvas.width, Math.random() * canvas.height * 0.5));
                }
                fireworks.forEach(fw => { fw.update(); fw.draw(ctx); });
                fireworks = fireworks.filter(fw => fw.particles.length > 0);
                requestAnimationFrame(animate);
            }
            animate();
            setTimeout(() => { fireworksActive = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }, 4000);
        }

        function initGame() {
            playerBox = null;
            openedBoxes = [];
            currentStage = 0;
            openedInCurrentStage = 0;
            gameActive = true;
            currentOffer = 0;
            lastOffer = 0;
            boxContents = {};
            prizeElementMap = {};

            const shuffled = [...prizes].sort(() => Math.random() - 0.5);
            for (let i = 1; i <= 22; i++) boxContents[i] = shuffled[i-1];

            renderPrizeTrees();
            renderBoxes();
            document.getElementById('stage-info').textContent = 'Kendi kutunuzu seçin!';
            document.getElementById('last-offer').textContent = '0 TL';
            document.getElementById('player-box-num').textContent = '?';
            document.getElementById('boxes-remaining').textContent = '22';
            document.getElementById('result-modal').classList.remove('show');
        }

        function resetGame() {
            document.getElementById('result-modal').classList.remove('show');
            initGame();
        }

        function renderPrizeTrees() {
            const l = document.getElementById('prize-tree-left');
            const r = document.getElementById('prize-tree-right');
            l.innerHTML = '';
            r.innerHTML = '';
            prizeElementMap = {};

            const counts = {};
            [...prizes].sort((a,b) => a-b).forEach(p => {
                if (!counts[p]) counts[p] = 0;
                counts[p]++;
                const el = document.createElement('div');
                const id = `prize-${p}-${counts[p]}`;
                el.id = id;
                el.className = `prize-item ${p<=10000?'blue':p<=500000?'yellow':'red'}`;
                el.textContent = p.toLocaleString('tr-TR') + ' TL';
                if (!prizeElementMap[p]) prizeElementMap[p] = [];
                prizeElementMap[p].push(id);
                (p <= 10000 ? l : r).appendChild(el);
            });
        }

        function renderBoxes() {
            const g = document.getElementById('boxes-grid');
            g.innerHTML = '';
            for (let i = 1; i <= 22; i++) {
                const b = document.createElement('div');
                b.className = 'game-box';
                b.id = `box-${i}`;
                b.innerHTML = `<div class="box-number">${i}</div><div class="box-avatar">${avatars[i-1]}</div>`;
                b.onclick = () => handleBoxClick(i);
                g.appendChild(b);
            }
        }

        function handleBoxClick(num) {
            initAudio();
            if (!gameActive || openedBoxes.includes(num)) return;

            if (playerBox === null) {
                playerBox = num;
                document.getElementById(`box-${num}`).classList.add('player-box');
                document.getElementById('player-box-num').textContent = num;
                document.getElementById('stage-info').textContent = `1. Etap: ${stages[0]} kutu açın`;
                return;
            }

            if (num === playerBox) {
                alert("Kendi kutunuzu açamazsınız!");
                return;
            }

            openBox(num);
        }

        function openBox(num) {
            const prize = boxContents[num];
            const modal = document.getElementById('box-modal');
            document.getElementById('modal-box-num').textContent = num;
            document.getElementById('revealed-prize').textContent = prize.toLocaleString('tr-TR') + ' TL';
            document.getElementById('revealed-prize').style.color = prize <= 10000 ? '#2196f3' : prize <= 500000 ? '#ffc107' : '#f44336';
            
            modal.classList.add('show');
            playDramSound();

            setTimeout(() => {
                if (prize <= 10000) playCelebration();
                else playDisappointment();
            }, 500);

            setTimeout(() => {
                modal.classList.remove('show');
                openedBoxes.push(num);
                openedInCurrentStage++;

                const boxEl = document.getElementById(`box-${num}`);
                boxEl.classList.add('disabled');
                boxEl.innerHTML = `<div style="font-size:0.7rem;color:var(--gold);">${prize.toLocaleString('tr-TR')} TL</div>`;

                if (prizeElementMap[prize] && prizeElementMap[prize].length > 0) {
                    const id = prizeElementMap[prize].shift();
                    const el = document.getElementById(id);
                    if (el) el.classList.add('opened');
                }

                document.getElementById('boxes-remaining').textContent = 22 - openedBoxes.length;

                if (openedInCurrentStage >= stages[currentStage]) {
                    gameActive = false;
                    setTimeout(showBankerOffer, 800);
                } else {
                    const rem = stages[currentStage] - openedInCurrentStage;
                    document.getElementById('stage-info').textContent = `${currentStage+1}. Etap: ${rem} kutu daha açın`;
                }
            }, 2000);
        }

        function showBankerOffer() {
            const remaining = prizes.filter(p => {
                if (boxContents[playerBox] === p) return true;
                return !openedBoxes.some(b => boxContents[b] === p);
            });

            if (remaining.length === 0) {
                openOwnBox();
                return;
            }

            const sum = remaining.reduce((a,b) => a+b, 0);
            const ev = sum / remaining.length;
            const mult = [0.20, 0.30, 0.40, 0.50, 0.60, 0.75, 0.90][currentStage] || 0.5;
            const random = 0.9 + Math.random() * 0.2;
            
            currentOffer = Math.round(ev * mult * random / 100) * 100;
            currentOffer = Math.max(currentOffer, Math.min(...remaining));

            playPhoneRing();

            setTimeout(() => {
                document.getElementById('banker-offer').textContent = currentOffer.toLocaleString('tr-TR') + ' TL';
                document.getElementById('banker-modal').classList.add('show');
            }, 1000);
        }

        function acceptOffer() {
            document.getElementById('banker-modal').classList.remove('show');
            showResult(true);
        }

        function rejectOffer() {
            document.getElementById('banker-modal').classList.remove('show');
            lastOffer = currentOffer;
            document.getElementById('last-offer').textContent = lastOffer.toLocaleString('tr-TR') + ' TL';
            currentStage++;
            openedInCurrentStage = 0;

            if (currentStage >= stages.length) {
                setTimeout(openOwnBox, 500);
            } else {
                gameActive = true;
                document.getElementById('stage-info').textContent = `${currentStage+1}. Etap: ${stages[currentStage]} kutu açın`;
            }
        }

        function openOwnBox() {
            openBox(playerBox);
            setTimeout(() => showResult(false), 3000);
        }

        function showResult(accepted) {
            const playerPrize = boxContents[playerBox];
            const final = accepted ? currentOffer : playerPrize;
            
            document.getElementById('result-amount').textContent = final.toLocaleString('tr-TR') + ' TL';
            document.getElementById('result-modal').classList.add('show');

            if (accepted) {
                document.getElementById('result-title').textContent = playerPrize <= final ? '🎉 TEBRİKLER!' : '😔 SONUÇ';
                document.getElementById('result-message').innerHTML = `Banka teklifini kabul ettiniz.<br>Kutunuzda: ${playerPrize.toLocaleString('tr-TR')} TL vardı.`;
                document.getElementById('result-amount').style.color = final >= playerPrize ? '#4caf50' : '#ff9800';
                if (final >= playerPrize) startFireworks();
            } else {
                if (playerPrize >= 100000) {
                    document.getElementById('result-title').textContent = '🎆 MUHTEŞEM!';
                    document.getElementById('result-message').innerHTML = 'Kutunuzdan büyük ödül çıktı!';
                    document.getElementById('result-amount').style.color = '#4caf50';
                    startFireworks();
                } else if (playerPrize >= 10000) {
                    document.getElementById('result-title').textContent = '😐 SONUÇ';
                    document.getElementById('result-message').innerHTML = `${playerPrize.toLocaleString('tr-TR')} TL kazandınız.`;
                    document.getElementById('result-amount').style.color = '#ffc107';
                } else {
                    document.getElementById('result-title').textContent = '😢 ÜZÜCÜ';
                    document.getElementById('result-message').innerHTML = `Kutunuzdan küçük ödül çıktı.<br>Banka teklifi: ${currentOffer.toLocaleString('tr-TR')} TL`;
                    document.getElementById('result-amount').style.color = '#f44336';
                    playDisappointment();
                }
            }

            for (let i = 1; i <= 22; i++) {
                if (!openedBoxes.includes(i)) {
                    document.getElementById(`box-${i}`).innerHTML = `<div style="font-size:0.65rem;color:var(--gold);">${boxContents[i].toLocaleString('tr-TR')} TL</div>`;
                }
            }
        }
    </script>
</body>
</html>
