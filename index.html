<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Var Mısın Yok Musun</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a237e, #0d1442);
            color: white;
        }

        /* ===== SPLASH ===== */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }
        #splash.hidden { display: none !important; }
        #splash img { width: min(50vw, 50vh, 350px); max-width: 90%; border-radius: 15px; margin-bottom: min(4vh, 30px); box-shadow: 0 0 30px rgba(255,215,0,0.5); }
        #progress { width: min(50vw, 300px); height: min(2vh, 10px); background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; border: 2px solid #ffd700; }
        #progress-bar { height: 100%; background: linear-gradient(90deg, #ffd700, #ff8f00); width: 0%; transition: width 0.1s linear; box-shadow: 0 0 10px rgba(255,215,0,0.5); }

        /* ===== GAME LAYOUT ===== */
        #game { display: none; width: 100vw; height: 100vh; overflow: hidden; }
        #game.show { display: flex; }

        .side {
            flex-shrink: 0;
            background: rgba(0,0,0,0.5);
            border: 2px solid #ffd700;
            border-radius: 5px;
            padding: min(0.4vh, 3px) min(0.2vw, 2px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: min(0.2vh, 2px);
            min-height: 0;
        }
        .side.left { margin-right: min(0.4vw, 3px); }
        .side.right { margin-left: min(0.4vw, 3px); }

        .prize {
            padding: min(0.3vh, 2px) min(0.15vw, 1px);
            border-radius: 3px;            text-align: center;
            font-weight: bold;
            font-size: clamp(0.4rem, 1vh, 0.65rem);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .prize.blue { background: linear-gradient(90deg, #2196f3, #64b5f6); color: #000; }
        .prize.yellow { background: linear-gradient(90deg, #ffc107, #ffe082); color: #000; }
        .prize.red { background: linear-gradient(90deg, #f44336, #ef5350); color: #fff; }
        .prize.opened { opacity: 0.15; filter: grayscale(100%); transform: scale(0.95); }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: min(0.4vh, 3px);
            min-height: 0;
            min-width: 0;
        }

        .header { text-align: center; margin-bottom: min(0.4vh, 3px); flex-shrink: 0; }
        .header h1 { font-size: clamp(0.8rem, 2.2vh, 1.3rem); color: #ffd700; margin-bottom: min(0.2vh, 2px); text-shadow: 0 0 10px rgba(255,215,0,0.6); }
        .stage {
            background: rgba(255,215,0,0.2);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: min(0.2vh, 2px) min(1vw, 10px);
            display: inline-block;
            font-weight: bold;
            font-size: clamp(0.6rem, 1.3vh, 0.85rem);
        }

        .boxes-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: min(0.3vh, 2px);
            min-height: 0;
        }

        .boxes-grid {
            display: grid;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        .box {
            background: linear-gradient(145deg, #283593, #1a237e);
            border: 2px solid #ffd700;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: all 0.3s;
            width: 100%;
            height: 100%;
            min-height: 0;
            min-width: 0;
        }
        .box:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,215,0,0.4); }
        .box:active { transform: scale(0.95); }
        .box.player {
            background: linear-gradient(145deg, #ffd700, #ff8f00);
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255,215,0,0.8);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.6); }
            50% { box-shadow: 0 0 16px rgba(255,215,0,1); }
        }
        .box.disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(80%); }
        .box-num { font-size: clamp(0.65rem, 1.8vh, 1rem); font-weight: 900; color: #ffd700; margin-bottom: 1px; line-height: 1; }
        .box.player .box-num { color: #000; }
        .box-emoji { font-size: clamp(0.75rem, 2.2vh, 1.2rem); line-height: 1; }

        .bottom {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            padding: clamp(3px, 0.6vh, 6px);
            margin-top: clamp(2px, 0.3vh, 3px);
            flex-shrink: 0;
        }
        .info {
            text-align: center;
            padding: clamp(2px, 0.5vh, 5px) clamp(5px, 1vw, 10px);
            background: rgba(255,215,0,0.15);
            border: 2px solid #ffd700;
            border-radius: 6px;
            min-width: clamp(45px, 9vw, 70px);        }
        .info-label { font-size: clamp(0.45rem, 1.1vh, 0.65rem); color: #ccc; margin-bottom: 1px; }
        .info-value { font-size: clamp(0.65rem, 1.8vh, 0.95rem); font-weight: 900; color: #ffd700; }

        @media (orientation: portrait) {
            #game { flex-direction: column; }
            .side {
                width: 100%;
                height: clamp(40px, 8vh, 65px);
                flex-direction: row;
                padding: clamp(2px, 0.3vh, 4px);
                margin: 0;
                border-radius: 5px;
                gap: clamp(2px, 0.3vh, 3px);
                overflow-x: auto;
                overflow-y: hidden;
            }
            .side.left { border-bottom: 2px solid #ffd700; border-right: none; order: 1; }
            .side.right { border-top: 2px solid #ffd700; border-left: none; order: 3; }
            .main { order: 2; }
            .prize { font-size: clamp(0.4rem, 1vh, 0.6rem); padding: clamp(1px, 0.2vh, 3px) clamp(2px, 0.4vw, 4px); min-width: clamp(40px, 8vw, 60px); }
            .boxes-grid { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: clamp(2px, 0.5vh, 5px); }
            .box-num { font-size: clamp(0.6rem, 1.8vh, 0.95rem); }
            .box-emoji { font-size: clamp(0.7rem, 2vh, 1.1rem); }
        }

        @media (orientation: landscape) {
            .side { height: 100%; width: clamp(60px, 9vw, 100px); }
            .side.left { border-right: 2px solid #ffd700; }
            .side.right { border-left: 2px solid #ffd700; }
            .boxes-grid { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: clamp(2px, 0.5vh, 5px); }
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 5000;
            justify-content: center; align-items: center;
        }
        .modal.show { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-box {
            background: linear-gradient(135deg, #1a237e, #0d1442);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: clamp(15px, 3vh, 30px);
            text-align: center;
            max-width: 90%;
            width: clamp(250px, 40vw, 450px);
            box-shadow: 0 0 40px rgba(255,215,0,0.5);        }
        .modal-title { font-size: clamp(1.1rem, 3.5vh, 1.8rem); color: #ffd700; margin-bottom: clamp(8px, 1.2vh, 12px); }
        .modal-text { font-size: clamp(0.85rem, 2.2vh, 1.05rem); margin: clamp(8px, 1.2vh, 12px) 0; }
        .big-amount { font-size: clamp(1.6rem, 5vh, 3rem); font-weight: 900; color: #4caf50; margin: clamp(12px, 2.5vh, 20px) 0; text-shadow: 0 0 12px rgba(76,175,80,0.6); }
        .modal-buttons { display: flex; gap: clamp(8px, 1.5vw, 15px); justify-content: center; margin-top: clamp(12px, 2.5vh, 20px); flex-wrap: wrap; }
        .btn {
            padding: clamp(8px, 1.8vh, 12px) clamp(18px, 3.5vw, 30px);
            font-size: clamp(0.85rem, 2.2vh, 1.1rem);
            font-weight: 700; border: none; border-radius: 25px; cursor: pointer;
            transition: all 0.3s;
        }
        .btn-yes { background: linear-gradient(135deg, #4caf50, #45a049); color: white; box-shadow: 0 3px 8px rgba(76,175,80,0.4); }
        .btn-no { background: linear-gradient(135deg, #f44336, #da190b); color: white; box-shadow: 0 3px 8px rgba(244,67,54,0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,0.4); }

        .box-open-anim { animation: boxShake 0.5s, boxOpen 1s 0.5s forwards; }
        @keyframes boxShake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
        @keyframes boxOpen { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        #fireworks { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 8000; }

        /* His Modal - Toast yerine */
        #feeling-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 4500;
            justify-content: center;
            align-items: center;
        }
        #feeling-modal.show {
            display: flex;
            animation: fadeIn 0.3s;
        }
        #feeling-modal .feeling-content {
            background: linear-gradient(135deg, #1a237e, #0d1442);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: clamp(20px, 4vh, 35px);
            text-align: center;
            max-width: 90%;
            width: clamp(280px, 45vw, 480px);
            box-shadow: 0 0 50px rgba(255,215,0,0.6);
            animation: feelingPop 0.4s ease-out;
        }
        @keyframes feelingPop {            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #feeling-modal .feeling-emoji {
            font-size: clamp(2.5rem, 7vh, 4rem);
            display: block;
            margin-bottom: clamp(10px, 2vh, 20px);
        }
        #feeling-modal .feeling-text {
            font-size: clamp(1rem, 2.5vh, 1.4rem);
            color: #ffd700;
            font-weight: bold;
            font-style: italic;
            margin-bottom: clamp(15px, 3vh, 25px);
            line-height: 1.4;
        }
        #feeling-modal .feeling-subtext {
            font-size: clamp(0.75rem, 1.8vh, 0.95rem);
            color: #aaa;
            margin-bottom: clamp(15px, 2.5vh, 20px);
        }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://github.com/oozata/ozata/blob/main/splach.png?raw=true" alt="Splash" id="splash-img">
        <div id="progress"><div id="progress-bar"></div></div>
    </div>

    <canvas id="fireworks"></canvas>

    <div id="game">
        <div class="side left" id="prizes-left"></div>
        <div class="main">
            <div class="header">
                <h1>📦 VAR MISIN YOK MUSUN 📦</h1>
                <div class="stage" id="stage">Kendi kutunuzu seçin!</div>
            </div>
            <div class="boxes-wrap">
                <div class="boxes-grid" id="boxes"></div>
            </div>
            <div class="bottom">
                <div class="info">
                    <div class="info-label">Son Teklif</div>
                    <div class="info-value" id="last-offer">0 TL</div>
                </div>
                <div class="info">
                    <div class="info-label">KUTUNUZ</div>
                    <div class="info-value" id="player-box">?</div>                </div>
                <div class="info">
                    <div class="info-label">Kalan</div>
                    <div class="info-value" id="remaining">22</div>
                </div>
            </div>
        </div>
        <div class="side right" id="prizes-right"></div>
    </div>

    <div class="modal" id="box-modal">
        <div class="modal-box box-open-anim" id="box-anim">
            <div class="modal-title" id="box-num">1</div>
            <div class="big-amount" id="box-prize">0 TL</div>
        </div>
    </div>

    <div class="modal" id="banker-modal">
        <div class="modal-box">
            <div class="modal-title">📞 BANKA ARIYOR!</div>
            <div class="modal-text">Size bir teklif sunuyor:</div>
            <div class="big-amount" id="banker-offer">0 TL</div>
            <div class="modal-buttons">
                <button class="btn btn-yes" onclick="accept()">VARIM!</button>
                <button class="btn btn-no" onclick="reject()">YOKUM!</button>
            </div>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div class="modal-box">
            <div class="modal-title" id="result-title">TEBRİKLER!</div>
            <div class="modal-text" id="result-msg"></div>
            <div class="big-amount" id="result-amount">0 TL</div>
            <button class="btn btn-yes" onclick="reset()" style="margin-top: 15px;">YENİ OYUN</button>
        </div>
    </div>

    <!-- His Modal (Toast yerine) -->
    <div id="feeling-modal">
        <div class="feeling-content">
            <span class="feeling-emoji" id="feeling-emoji">🔴</span>
            <div class="feeling-text" id="feeling-text">Kutumda kırmızı hissediyorum!</div>
            <div class="feeling-subtext">Bu kutuyu açmak istediğinize emin misiniz?</div>
            <div class="modal-buttons">
                <button class="btn btn-yes" onclick="confirmOpenBox()">YİNE DE AÇ</button>
                <button class="btn btn-no" onclick="cancelOpenBox()">VAZGEÇ</button>
            </div>
        </div>
    </div>
    <script>
        // ===== SPLASH =====
        const splash = document.getElementById('splash');
        const splashImg = document.getElementById('splash-img');
        const progressBar = document.getElementById('progress-bar');
        let started = false;

        function startGame() {
            if (started) return;
            started = true;
            let p = 0;
            const duration = 4000;
            const interval = 100;
            const timer = setInterval(() => {
                p += 100 / (duration / interval);
                if (p >= 100) {
                    p = 100;
                    clearInterval(timer);
                    setTimeout(() => {
                        splash.classList.add('hidden');
                        document.getElementById('game').style.display = 'flex';
                        document.getElementById('game').classList.add('show');
                        init();
                    }, 500);
                }
                progressBar.style.width = p + '%';
            }, interval);
        }

        splashImg.onload = startGame;
        splashImg.onerror = () => { console.log("Resim yüklenemedi"); setTimeout(startGame, 1000); };
        setTimeout(() => { if (!started) startGame(); }, 5000);

        // ===== OYUN DEĞİŞKENLERİ =====
        const prizes = [1,5,10,25,50,100,250,500,1000,5000,10000,25000,50000,100000,250000,500000,750000,1000000,2000000,3000000,5000000,5000000];
        
        const avatars = [
            '😀', '😎', '', '🥳', '',
            '🧐', '', '🥰', '😘', '🎉',
            '', '😎', '🤠', '🤗', '🤩',
            '😇', '🤯', '', '', '🤡',
            '', '🎃'
        ];
        
        let boxContents = {}, playerBox = null, opened = [], stage = 0, openedInStage = 0;
        const stages = [4,3,3,3,3,2,2];
        let gameActive = false, offer = 0, lastOffer = 0, audioCtx = null, prizeMap = {};
        let redOpenedCount = 0;
        let pendingBox = null; // His modal'ı için bekleyen kutu
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                
                if (type === 'ring') {
                    for (let i = 0; i < 3; i++) {
                        const osc = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        osc.connect(g); g.connect(audioCtx.destination);
                        osc.type = 'sine';
                        osc.frequency.value = 440;
                        g.gain.setValueAtTime(0, now + i*0.6);
                        g.gain.linearRampToValueAtTime(0.3, now + i*0.6 + 0.05);
                        g.gain.setValueAtTime(0.3, now + i*0.6 + 0.2);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i*0.6 + 0.3);
                        osc.start(now + i*0.6);
                        osc.stop(now + i*0.6 + 0.3);
                    }
                } else if (type === 'dram') {
                    for (let i = 0; i < 8; i++) {
                        const osc = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        osc.connect(g); g.connect(audioCtx.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(80, now + i*0.15);
                        osc.frequency.exponentialRampToValueAtTime(40, now + i*0.15 + 0.1);
                        g.gain.setValueAtTime(0.3, now + i*0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i*0.15 + 0.1);
                        osc.start(now + i*0.15);
                        osc.stop(now + i*0.15 + 0.1);
                    }
                } else if (type === 'happy') {
                    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < audioCtx.sampleRate; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buf;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass'; filter.frequency.value = 800;
                    const g = audioCtx.createGain();
                    g.gain.setValueAtTime(0, now);                    g.gain.linearRampToValueAtTime(0.5, now + 0.5);
                    g.gain.setValueAtTime(0.5, now + 1.5);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 3);
                    noise.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
                    noise.start(now);
                } else if (type === 'sad') {
                    for (let i = 0; i < 3; i++) {
                        const osc = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        osc.connect(g); g.connect(audioCtx.destination);
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(400, now + i*0.4);
                        osc.frequency.exponentialRampToValueAtTime(250, now + i*0.4 + 0.3);
                        g.gain.setValueAtTime(0, now + i*0.4);
                        g.gain.linearRampToValueAtTime(0.3, now + i*0.4 + 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i*0.4 + 0.3);
                        osc.start(now + i*0.4);
                        osc.stop(now + i*0.4 + 0.3);
                    }
                }
            } catch(e) { console.error("Ses hatası:", e); }
        }

        // ===== HAVAİ FİŞEK =====
        class FW {
            constructor(x, y) {
                this.x = x; this.y = y; this.p = [];
                const c = ['#f00','#0f0','#00f','#ff0','#f0f','#0ff','#fa0','#fff'];
                for (let i = 0; i < 50; i++) {
                    const a = (Math.PI * 2 * i) / 50;
                    const v = 3 + Math.random() * 3;
                    this.p.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, color: c[Math.floor(Math.random()*8)]});
                }
            }
            update() { this.p.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.02; }); this.p = this.p.filter(p => p.life > 0); }
            draw(ctx) { this.p.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); }); }
        }

        let fws = [], fwActive = false;
        function startFW() {
            fwActive = true;
            const c = document.getElementById('fireworks');
            const ctx = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            function anim() {
                if (!fwActive) { ctx.clearRect(0,0,c.width,c.height); return; }
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0,0,c.width,c.height);
                if (Math.random() < 0.05) fws.push(new FW(Math.random()*c.width, Math.random()*c.height*0.6));
                fws.forEach(f => { f.update(); f.draw(ctx); });                fws = fws.filter(f => f.p.length > 0);
                requestAnimationFrame(anim);
            }
            anim();
            setTimeout(() => { fwActive = false; }, 5000);
        }

        // ===== YARDIMCI FONKSİYONLAR =====
        function roundTo5000(n) {
            const rounded = Math.round(n / 5000) * 5000;
            return Math.max(rounded, 1000);
        }

        function isRed(prize) {
            return prize >= 750000;
        }

        function getMedian(sortedArray) {
            const len = sortedArray.length;
            if (len === 0) return 0;
            if (len % 2 === 1) {
                return sortedArray[Math.floor(len / 2)];
            } else {
                return (sortedArray[len / 2 - 1] + sortedArray[len / 2]) / 2;
            }
        }

        function countReds(array) {
            return array.filter(p => isRed(p)).length;
        }

        // ===== HIS (FEELING) SISTEMI =====
        function generateFeeling(remainingPrizes) {
            const sorted = [...remainingPrizes].sort((a, b) => a - b);
            
            const reds = sorted.filter(p => p >= 750000);
            const yellows = sorted.filter(p => p >= 25000 && p <= 500000);
            const blues = sorted.filter(p => p <= 10000);
            
            const redCount = reds.length;
            const yellowCount = yellows.length;
            const blueCount = blues.length;
            const total = sorted.length;
            
            const availableColors = [];
            if (redCount > 0) availableColors.push({ name: 'kırmızı', count: redCount, emoji: '🔴', weight: redCount });
            if (yellowCount > 0) availableColors.push({ name: 'sarı', count: yellowCount, emoji: '🟡', weight: yellowCount });
            if (blueCount > 0) availableColors.push({ name: 'mavi', count: blueCount, emoji: '', weight: blueCount });
            
            if (availableColors.length === 0) return null;            
            if (Math.random() < 0.25 && total > 1) {
                const randomPrize = sorted[Math.floor(Math.random() * sorted.length)];
                return {
                    emoji: '',
                    text: `Kutumda ${randomPrize.toLocaleString('tr-TR')} TL hissediyorum!`
                };
            }
            
            const totalWeight = availableColors.reduce((sum, c) => sum + c.weight, 0);
            let random = Math.random() * totalWeight;
            let selectedColor = availableColors[0];
            
            for (const color of availableColors) {
                random -= color.weight;
                if (random <= 0) {
                    selectedColor = color;
                    break;
                }
            }
            
            const messages = [
                `Kutumda ${selectedColor.name} hissediyorum!`,
                `İçimde ${selectedColor.name} bir his var...`,
                `Kutum ${selectedColor.name} gibi duruyor!`,
                `Bence kutumda ${selectedColor.name} var!`,
                `${selectedColor.name} çıkacak gibi hissediyorum!`
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            return {
                emoji: selectedColor.emoji,
                text: randomMessage
            };
        }

        function showFeelingModal(remainingPrizes, boxNum) {
            const feeling = generateFeeling(remainingPrizes);
            if (!feeling) {
                // His oluşamazsa direkt aç
                pendingBox = boxNum;
                confirmOpenBox();
                return;
            }
            
            pendingBox = boxNum;
            
            const modal = document.getElementById('feeling-modal');
            const emojiEl = document.getElementById('feeling-emoji');            const textEl = document.getElementById('feeling-text');
            
            emojiEl.textContent = feeling.emoji;
            textEl.textContent = feeling.text;
            
            modal.classList.add('show');
        }

        function confirmOpenBox() {
            document.getElementById('feeling-modal').classList.remove('show');
            if (pendingBox !== null) {
                openBox(pendingBox);
                pendingBox = null;
            }
        }

        function cancelOpenBox() {
            document.getElementById('feeling-modal').classList.remove('show');
            pendingBox = null;
            // Oyuncu vazgeçti, tekrar kutu seçebilir
        }

        // ===== YENİ BANKA TEKLİF MANTIĞI =====
        function calculateBankerOffer(remainingPrizes, currentStage) {
            const sorted = [...remainingPrizes].sort((a, b) => a - b);
            const minPrize = sorted[0];
            const maxPrize = sorted[sorted.length - 1];
            const median = getMedian(sorted);
            const redCount = countReds(sorted);
            
            let offer = 0;

            if (currentStage < 4) {
                const stageBands = [
                    { min: 10000, max: 30000 },
                    { min: 30000, max: 80000 },
                    { min: 80000, max: 200000 },
                    { min: 200000, max: 500000 }
                ];
                
                const band = stageBands[currentStage];
                
                const medianRatio = median / 100000;
                const baseOffer = band.min + (band.max - band.min) * Math.min(medianRatio, 1);
                
                let adjustment = 1.0;
                if (redCount > 0) adjustment -= redCount * 0.05;
                
                offer = baseOffer * adjustment;
                offer *= (0.85 + Math.random() * 0.3);                offer = roundTo5000(offer);
                offer = Math.max(offer, band.min);
                
                const maxLimit = (redCount === 0) ? 800000 : 500000;
                offer = Math.min(offer, maxLimit);
                
                return offer;
            }

            if (currentStage === 6) {
                const avg = (sorted[0] + sorted[1]) / 2;
                offer = avg * (0.90 + Math.random() * 0.07);
                offer = roundTo5000(offer);
                offer = Math.max(offer, minPrize);
                offer = Math.min(offer, maxPrize);
            } else {
                let multiplier;
                
                if (redCount >= 3) {
                    multiplier = 1.10 + Math.random() * 0.30;
                } else if (redCount >= 1) {
                    multiplier = 1.00 + Math.random() * 0.25;
                } else {
                    multiplier = 0.85 + Math.random() * 0.25;
                }
                
                offer = median * multiplier;
                
                if (redOpenedCount > 0) {
                    offer *= Math.pow(0.75, redOpenedCount);
                }
                
                offer *= (0.90 + Math.random() * 0.20);
                offer = roundTo5000(offer);
                offer = Math.max(offer, 5000);
                offer = Math.min(offer, maxPrize * 0.95);
            }

            return offer;
        }

        // ===== OYUN MANTIĞI =====
        function init() {
            playerBox = null; opened = []; stage = 0; openedInStage = 0; gameActive = true; offer = 0; lastOffer = 0;
            redOpenedCount = 0; pendingBox = null;
            boxContents = {}; prizeMap = {};
            const shuf = [...prizes].sort(() => Math.random() - 0.5);
            for (let i = 1; i <= 22; i++) boxContents[i] = shuf[i-1];
            renderPrizes();
            renderBoxes();            document.getElementById('stage').textContent = 'Kendi kutunuzu seçin!';
            document.getElementById('last-offer').textContent = '0 TL';
            document.getElementById('player-box').textContent = '?';
            document.getElementById('remaining').textContent = '22';
            document.getElementById('result-modal').classList.remove('show');
        }

        function reset() {
            document.getElementById('result-modal').classList.remove('show');
            init();
        }

        function renderPrizes() {
            const l = document.getElementById('prizes-left');
            const r = document.getElementById('prizes-right');
            l.innerHTML = ''; r.innerHTML = ''; prizeMap = {};
            const cnt = {};
            [...prizes].sort((a,b) => a-b).forEach(p => {
                if (!cnt[p]) cnt[p] = 0;
                cnt[p]++;
                const el = document.createElement('div');
                const id = `pr-${p}-${cnt[p]}`;
                el.id = id;
                el.className = `prize ${p<=10000?'blue':p<=500000?'yellow':'red'}`;
                el.textContent = p.toLocaleString('tr-TR') + ' TL';
                if (!prizeMap[p]) prizeMap[p] = [];
                prizeMap[p].push(id);
                (p <= 10000 ? l : r).appendChild(el);
            });
        }

        function renderBoxes() {
            const g = document.getElementById('boxes');
            g.innerHTML = '';
            for (let i = 1; i <= 22; i++) {
                const b = document.createElement('div');
                b.className = 'box';
                b.id = `box-${i}`;
                b.innerHTML = `<div class="box-num">${i}</div><div class="box-emoji">${avatars[i-1]}</div>`;
                b.onclick = () => click(i);
                g.appendChild(b);
            }
        }

        function click(n) {
            initAudio();
            if (!gameActive || opened.includes(n)) return;
            if (playerBox === null) {
                playerBox = n;
                document.getElementById(`box-${n}`).classList.add('player');                document.getElementById('player-box').textContent = n;
                document.getElementById('stage').textContent = `1. Etap: ${stages[0]} kutu açın`;
                return;
            }
            if (n === playerBox) { alert("Kendi kutunuzu açamazsınız!"); return; }
            
            // Kalan ödülleri hesapla
            const currentRemaining = prizes.filter(pr => {
                if (boxContents[playerBox] === pr) return true;
                return !opened.some(bx => boxContents[bx] === pr);
            });
            
            // His modal'ını göster
            showFeelingModal(currentRemaining, n);
        }

        function openBox(n) {
            const p = boxContents[n];
            const m = document.getElementById('box-modal');
            const anim = document.getElementById('box-anim');
            document.getElementById('box-num').textContent = n;
            document.getElementById('box-prize').textContent = p.toLocaleString('tr-TR') + ' TL';
            document.getElementById('box-prize').style.color = p <= 10000 ? '#2196f3' : p <= 500000 ? '#ffc107' : '#f44336';
            
            anim.classList.remove('box-open-anim');
            void anim.offsetWidth;
            anim.classList.add('box-open-anim');
            
            m.classList.add('show');
            playSound('dram');
            
            setTimeout(() => { playSound(p <= 10000 ? 'happy' : 'sad'); }, 500);
            
            setTimeout(() => {
                m.classList.remove('show');
                anim.classList.remove('box-open-anim');
                opened.push(n);
                openedInStage++;
                
                if (isRed(p) && stage >= 3) {
                    redOpenedCount++;
                }
                
                const b = document.getElementById(`box-${n}`);
                b.classList.add('disabled');
                b.innerHTML = `<div style="font-size:0.6rem;color:#ffd700;">${p.toLocaleString('tr-TR')} TL</div>`;
                if (prizeMap[p] && prizeMap[p].length > 0) {
                    const id = prizeMap[p].shift();
                    const el = document.getElementById(id);
                    if (el) el.classList.add('opened');                }
                document.getElementById('remaining').textContent = 22 - opened.length;
                
                if (openedInStage >= stages[stage]) {
                    gameActive = false;
                    setTimeout(banker, 800);
                } else {
                    const rem = stages[stage] - openedInStage;
                    document.getElementById('stage').textContent = `${stage+1}. Etap: ${rem} kutu daha açın`;
                }
            }, 2500);
        }

        function banker() {
            const remaining = prizes.filter(p => {
                if (boxContents[playerBox] === p) return true;
                return !opened.some(b => boxContents[b] === p);
            });
            
            if (remaining.length === 0) { openOwn(); return; }
            
            offer = calculateBankerOffer(remaining, stage);
            
            playSound('ring');
            setTimeout(() => {
                document.getElementById('banker-offer').textContent = offer.toLocaleString('tr-TR') + ' TL';
                document.getElementById('banker-modal').classList.add('show');
            }, 1200);
        }

        function accept() {
            document.getElementById('banker-modal').classList.remove('show');
            result(true);
        }

        function reject() {
            document.getElementById('banker-modal').classList.remove('show');
            lastOffer = offer;
            document.getElementById('last-offer').textContent = lastOffer.toLocaleString('tr-TR') + ' TL';
            stage++;
            openedInStage = 0;
            if (stage >= stages.length) setTimeout(openOwn, 500);
            else {
                gameActive = true;
                document.getElementById('stage').textContent = `${stage+1}. Etap: ${stages[stage]} kutu açın`;
            }
        }

        function openOwn() {
            openBox(playerBox);            setTimeout(() => result(false), 3000);
        }

        function result(acc) {
            const pp = boxContents[playerBox];
            const fin = acc ? offer : pp;
            document.getElementById('result-amount').textContent = fin.toLocaleString('tr-TR') + ' TL';
            document.getElementById('result-modal').classList.add('show');
            if (acc) {
                document.getElementById('result-title').textContent = pp <= fin ? ' TEBRİKLER!' : '😔 SONUÇ';
                document.getElementById('result-msg').innerHTML = `Banka teklifini kabul ettiniz.<br>Kutunuzda: ${pp.toLocaleString('tr-TR')} TL vardı.`;
                document.getElementById('result-amount').style.color = fin >= pp ? '#4caf50' : '#ff9800';
                if (fin >= pp) startFW();
            } else {
                if (pp >= 100000) {
                    document.getElementById('result-title').textContent = '🎆 MUHTEŞEM!';
                    document.getElementById('result-msg').innerHTML = 'Kutunuzdan büyük ödül çıktı!<br>Harika bir oyun çıkardınız!';
                    document.getElementById('result-amount').style.color = '#4caf50';
                    startFW();
                } else if (pp >= 10000) {
                    document.getElementById('result-title').textContent = '😐 SONUÇ';
                    document.getElementById('result-msg').innerHTML = `Kutunuzdan orta seviye ödül çıktı.<br>${pp.toLocaleString('tr-TR')} TL kazandınız.`;
                    document.getElementById('result-amount').style.color = '#ffc107';
                } else {
                    document.getElementById('result-title').textContent = '😢 ÜZÜCÜ';
                    document.getElementById('result-msg').innerHTML = `Kutunuzdan küçük ödül çıktı.<br>Banka teklifini (${offer.toLocaleString('tr-TR')} TL) reddetmiştiniz.`;
                    document.getElementById('result-amount').style.color = '#f44336';
                    playSound('sad');
                }
            }
            for (let i = 1; i <= 22; i++) {
                if (!opened.includes(i)) {
                    document.getElementById(`box-${i}`).innerHTML = `<div style="font-size:0.55rem;color:#ffd700;">${boxContents[i].toLocaleString('tr-TR')} TL</div>`;
                }
            }
        }
    </script>
