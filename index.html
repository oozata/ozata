<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Var Mısın Yok Musun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0e27;
            --box-blue: #1a237e;
            --gold: #ffd700;
            --blue-prize: #2196f3;
            --yellow-prize: #ffc107;
            --red-prize: #f44336;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1a237e 0%, #0d1442 100%);
            color: white;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash-image {
            width: 60%;
            max-width: 350px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        #progress-container {
            width: 60%;
            max-width: 280px;
            height: 8px;
            background: #222;
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), #ff8f00);
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease-in-out;
        }

        /* Game Wrapper - Responsive */
        .game-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 0.5vh 0.5vw;
        }

        .prize-tree-left {
            width: 9%;
            min-width: 50px;
            background: rgba(0,0,0,0.5);
            padding: 0.5vh 0.2vw;
            display: flex;
            flex-direction: column;
            gap: 0.3vh;
            overflow-y: auto;
            border-right: 2px solid var(--gold);
            border-radius: 5px;        }

        .prize-item {
            padding: 0.4vh 0.2vw;
            border-radius: 3px;
            text-align: center;
            font-weight: 700;
            font-size: clamp(0.5rem, 1.2vh, 0.75rem);
            transition: all 0.3s;
            white-space: nowrap;
        }

        .prize-item.blue { background: linear-gradient(90deg, var(--blue-prize), #64b5f6); color: #000; }
        .prize-item.yellow { background: linear-gradient(90deg, var(--yellow-prize), #ffe082); color: #000; }
        .prize-item.red { background: linear-gradient(90deg, var(--red-prize), #ef5350); color: #fff; }

        .prize-item.opened {
            opacity: 0.15;
            filter: grayscale(100%);
            transform: scale(0.95);
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5vh 0.5vw;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 0.5vh;
        }

        .header h1 {
            font-size: clamp(1rem, 3vh, 1.8rem);
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin-bottom: 0.3vh;
        }

        .stage-info {
            background: rgba(255,215,0,0.2);
            padding: 0.4vh 1vw;
            border-radius: 12px;
            display: inline-block;
            font-weight: 700;
            border: 2px solid var(--gold);            font-size: clamp(0.7rem, 1.8vh, 1rem);
        }

        .boxes-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0.5vh;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(4px, 0.8vh, 8px);
            width: 100%;
            max-width: 100%;
        }

        .game-box {
            aspect-ratio: 4/3;
            background: linear-gradient(145deg, #283593, #1a237e);
            border: 2px solid var(--gold);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .game-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .game-box:active {
            transform: scale(0.95);
        }

        .game-box.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(80%);
        }
        .game-box.player-box {
            background: linear-gradient(145deg, var(--gold), #ff8f00);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: playerBoxPulse 2s infinite;
        }

        @keyframes playerBoxPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 1); }
        }

        .box-number {
            font-size: clamp(0.9rem, 2.5vh, 1.3rem);
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 0.2vh;
        }

        .box-avatar {
            font-size: clamp(1rem, 3vh, 1.5rem);
        }

        .game-box.player-box .box-number {
            color: #000;
        }

        .bottom-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 0.8vh 0.5vw;
            border-radius: 8px;
            margin-top: 0.5vh;
        }

        .info-box {
            text-align: center;
            padding: 0.6vh 1vw;
            background: rgba(255,215,0,0.15);
            border-radius: 6px;
            border: 2px solid var(--gold);
            min-width: clamp(60px, 10vw, 100px);
        }

        .info-label {
            font-size: clamp(0.55rem, 1.3vh, 0.75rem);
            color: #ccc;
            margin-bottom: 0.2vh;        }

        .info-value {
            font-size: clamp(0.8rem, 2vh, 1.1rem);
            font-weight: 900;
            color: var(--gold);
        }

        .prize-tree-right {
            width: 9%;
            min-width: 50px;
            background: rgba(0,0,0,0.5);
            padding: 0.5vh 0.2vw;
            display: flex;
            flex-direction: column;
            gap: 0.3vh;
            overflow-y: auto;
            border-left: 2px solid var(--gold);
            border-radius: 5px;
        }

        /* Modals */
        .box-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 5000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .box-modal.show {
            display: flex;
            animation: modalFadeIn 0.3s;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .opening-box {
            width: clamp(180px, 30vw, 280px);
            height: clamp(140px, 25vh, 220px);
            background: linear-gradient(145deg, #283593, #1a237e);            border: 3px solid var(--gold);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: boxShake 0.5s;
        }

        @keyframes boxShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .opening-box.opening {
            animation: boxOpen 1s forwards;
        }

        @keyframes boxOpen {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .opening-box .box-number {
            font-size: clamp(2rem, 5vh, 3.5rem);
            margin-bottom: 1vh;
        }

        .revealed-prize {
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s;
        }

        .revealed-prize.show {
            opacity: 1;
            transform: scale(1);
            animation: prizePop 0.5s;
        }

        @keyframes prizePop {
            0% { transform: scale(0); }            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .banker-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 6000;
            justify-content: center;
            align-items: center;
        }

        .banker-modal.show {
            display: flex;
        }

        .banker-content {
            background: linear-gradient(135deg, #1a237e, #0d1442);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: clamp(15px, 3vh, 30px);
            text-align: center;
            max-width: 90%;
            width: clamp(280px, 40vw, 450px);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            animation: phoneRing 0.5s;
        }

        @keyframes phoneRing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .banker-title {
            font-size: clamp(1.2rem, 3vh, 1.8rem);
            color: var(--gold);
            margin-bottom: 1vh;
        }

        .banker-offer {
            font-size: clamp(1.8rem, 5vh, 3rem);
            font-weight: 900;
            color: #4caf50;
            margin: 2vh 0;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.6);        }

        .banker-buttons {
            display: flex;
            gap: 1vw;
            justify-content: center;
            margin-top: 2vh;
            flex-wrap: wrap;
        }

        .btn {
            padding: clamp(8px, 1.5vh, 15px) clamp(15px, 3vw, 30px);
            font-size: clamp(0.9rem, 2vh, 1.2rem);
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-yes {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #f44336, #da190b);
            color: white;
            box-shadow: 0 3px 10px rgba(244, 67, 54, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 7000;
            justify-content: center;
            align-items: center;
        }
        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: linear-gradient(135deg, #1a237e, #0d1442);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: clamp(15px, 3vh, 30px);
            text-align: center;
            max-width: 90%;
            width: clamp(280px, 50vw, 550px);
        }

        .result-title {
            font-size: clamp(1.3rem, 3.5vh, 2.2rem);
            margin-bottom: 1vh;
        }

        .result-amount {
            font-size: clamp(2rem, 6vh, 3.5rem);
            font-weight: 900;
            color: var(--gold);
            margin: 2vh 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 8000;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <img id="splash-image" src="https://github.com/oozata/ozata/blob/main/splach.png?raw=true" alt="Splash">
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- Fireworks Canvas -->
    <canvas id="fireworks-canvas"></canvas>
    <!-- Game -->
    <div class="game-wrapper">
        <div class="prize-tree-left" id="prize-tree-left"></div>

        <div class="game-area">
            <div class="header">
                <h1>📦 VAR MISIN YOK MUSUN 📦</h1>
                <div class="stage-info" id="stage-info">Kendi kutunuzu seçin!</div>
            </div>

            <div class="boxes-container">
                <div class="boxes-grid" id="boxes-grid"></div>
            </div>

            <div class="bottom-info">
                <div class="info-box">
                    <div class="info-label">Son Teklif</div>
                    <div class="info-value" id="last-offer">0 TL</div>
                </div>
                <div class="info-box">
                    <div class="info-label">KUTUNUZ</div>
                    <div class="info-value" id="player-box-num">?</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Kalan</div>
                    <div class="info-value" id="boxes-remaining">22</div>
                </div>
            </div>
        </div>

        <div class="prize-tree-right" id="prize-tree-right"></div>
    </div>

    <!-- Modals -->
    <div class="box-modal" id="box-modal">
        <div class="opening-box" id="opening-box">
            <div class="box-number" id="modal-box-num">1</div>
            <div class="box-avatar"></div>
            <div class="revealed-prize" id="revealed-prize">0 TL</div>
        </div>
    </div>

    <div class="banker-modal" id="banker-modal">
        <div class="banker-content">
            <div class="banker-title">📞 BANKA ARIYOR!</div>
            <div style="font-size: clamp(0.8rem, 2vh, 1rem); margin-bottom: 1vh;">Size bir teklif sunuyor:</div>
            <div class="banker-offer" id="banker-offer">0 TL</div>
            <div class="banker-buttons">
                <button class="btn btn-yes" onclick="acceptOffer()">VARIM!</button>
                <button class="btn btn-no" onclick="rejectOffer()">YOKUM!</button>            </div>
        </div>
    </div>

    <div class="result-modal" id="result-modal">
        <div class="result-content">
            <div class="result-title" id="result-title">TEBRİKLER!</div>
            <div style="font-size: clamp(0.9rem, 2vh, 1.1rem); margin-bottom: 1.5vh;" id="result-message"></div>
            <div class="result-amount" id="result-amount">0 TL</div>
            <button class="btn btn-yes" onclick="resetGame()" style="margin-top: 2vh;">YENİ OYUN</button>
        </div>
    </div>

    <script>
        // === SPLASH SCREEN ===
        const splashScreen = document.getElementById('splash-screen');
        const progressBar = document.getElementById('progress-bar');
        const splashImg = document.getElementById('splash-image');

        splashImg.onload = () => {
            let progress = 0;
            const duration = 4000;
            const interval = 100;
            const totalSteps = duration / interval;

            const timer = setInterval(() => {
                progress += 100 / totalSteps;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    splashScreen.classList.add('hidden');
                    setTimeout(initGame, 500);
                }
                progressBar.style.width = `${progress}%`;
            }, interval);
        };

        splashImg.onerror = () => {
            setTimeout(initGame, 1000);
        };

        // === GAME VARIABLES ===
        const prizes = [
            1, 5, 10, 25, 50, 100, 250, 500, 1000, 5000, 10000,
            25000, 50000, 100000, 250000, 500000,
            750000, 1000000, 2000000, 3000000, 5000000, 5000000
        ];

        const avatars = [
            '😀', '😎', '🤠', '🥳', '🤔', '🧐', '😍', '🥰', '😘', '🎉', '🤪',            '😎', '', '🤗', '🤩', '😇', '🤯', '', '🥸', '🤡', '👻', '🎃'
        ];
        
        let boxContents = {};
        let playerBox = null;
        let openedBoxes = [];
        let currentStage = 0;
        const stages = [4, 3, 3, 3, 3, 2, 2];
        let openedInCurrentStage = 0;
        let gameActive = false;
        let currentOffer = 0;
        let lastOffer = 0;
        let audioCtx = null;
        let prizeElementMap = {}; // prize değeri -> element ID eşleştirmesi

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // === TELEFON SESİ ===
        function playPhoneRing() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                for (let i = 0; i < 3; i++) {
                    const startTime = now + (i * 0.6);
                    
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.type = 'sine';
                    osc1.frequency.value = 440;
                    gain1.gain.setValueAtTime(0, startTime);
                    gain1.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                    gain1.gain.setValueAtTime(0.3, startTime + 0.2);
                    gain1.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);
                    osc1.start(startTime);
                    osc1.stop(startTime + 0.25);
                    
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.type = 'sine';
                    osc2.frequency.value = 480;
                    gain2.gain.setValueAtTime(0, startTime + 0.1);                    gain2.gain.linearRampToValueAtTime(0.3, startTime + 0.15);
                    gain2.gain.setValueAtTime(0.3, startTime + 0.2);
                    gain2.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);
                    osc2.start(startTime + 0.1);
                    osc2.stop(startTime + 0.25);
                }
            } catch(e) {
                console.error("Telefon sesi hatası:", e);
            }
        }

        function playDramSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                for (let i = 0; i < 8; i++) {
                    const t = now + i * 0.15;
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(80, t);
                    osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
                    osc.type = 'square';
                    g.gain.setValueAtTime(0.3, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                }
            } catch(e) {}
        }

        function playCelebration() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < audioCtx.sampleRate; i++) d[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buf;
                const f = audioCtx.createBiquadFilter();
                f.type = 'bandpass'; f.frequency.value = 800;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0, now);
                g.gain.linearRampToValueAtTime(0.5, now + 0.5);
                g.gain.setValueAtTime(0.5, now + 1.5);
                g.gain.exponentialRampToValueAtTime(0.01, now + 3);
                noise.connect(f); f.connect(g); g.connect(audioCtx.destination);
                noise.start(now);
            } catch(e) {}
        }
        function playDisappointment() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now + i*0.4);
                    osc.frequency.exponentialRampToValueAtTime(250, now + i*0.4 + 0.3);
                    g.gain.setValueAtTime(0, now + i*0.4);
                    g.gain.linearRampToValueAtTime(0.3, now + i*0.4 + 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.4 + 0.3);
                    osc.start(now + i*0.4);
                    osc.stop(now + i*0.4 + 0.3);
                }
            } catch(e) {}
        }

        // === HAVAİ FİŞEK ===
        class Firework {
            constructor(x, y) {
                this.x = x; 
                this.y = y;
                this.particles = [];
                const cols = ['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff','#ffa500','#ffffff'];
                for (let i = 0; i < 50; i++) {
                    const a = (Math.PI*2*i)/50;
                    const v = 3 + Math.random()*3;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(a)*v,
                        vy: Math.sin(a)*v,
                        life: 1,
                        color: cols[Math.floor(Math.random()*cols.length)]
                    });
                }
            }
            update() {
                this.particles.forEach(p => {
                    p.x += p.vx; 
                    p.y += p.vy; 
                    p.vy += 0.05; 
                    p.life -= 0.02;
                });
                this.particles = this.particles.filter(p => p.life > 0);
            }
            draw(ctx) {                this.particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); 
                    ctx.arc(p.x, p.y, 3, 0, Math.PI*2); 
                    ctx.fill();
                });
            }
        }

        let fireworks = [];
        let fireworksActive = false;

        function startFireworks() {
            fireworksActive = true;
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            function animate() {
                if (!fireworksActive) return;
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0,0,canvas.width,canvas.height);

                if (Math.random() < 0.05) {
                    fireworks.push(new Firework(
                        Math.random()*canvas.width,
                        Math.random()*canvas.height*0.6
                    ));
                }

                fireworks.forEach(fw => { 
                    fw.update(); 
                    fw.draw(ctx); 
                });
                fireworks = fireworks.filter(fw => fw.particles.length > 0);
                requestAnimationFrame(animate);
            }
            animate();
            setTimeout(() => {
                fireworksActive = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 5000);
        }

        // === OYUN MANTIĞI ===
        function initGame() {
            playerBox = null;
            openedBoxes = [];            currentStage = 0;
            openedInCurrentStage = 0;
            gameActive = true;
            currentOffer = 0;
            lastOffer = 0;
            boxContents = {};
            prizeElementMap = {};

            const shuffled = [...prizes].sort(() => Math.random() - 0.5);
            for (let i = 1; i <= 22; i++) boxContents[i] = shuffled[i-1];

            renderPrizeTrees();
            renderBoxes();
            document.getElementById('stage-info').textContent = 'Kendi kutunuzu seçin!';
            document.getElementById('last-offer').textContent = '0 TL';
            document.getElementById('player-box-num').textContent = '?';
            document.getElementById('boxes-remaining').textContent = '22';
            document.getElementById('result-modal').classList.remove('show');
        }

        function resetGame() {
            initGame();
        }

        function renderPrizeTrees() {
            const l = document.getElementById('prize-tree-left');
            const r = document.getElementById('prize-tree-right');
            l.innerHTML = ''; 
            r.innerHTML = '';
            prizeElementMap = {};
            
            // Aynı tutarlı ödüller için benzersiz ID'ler oluştur
            const prizeCounts = {};
            [...prizes].sort((a,b)=>a-b).forEach(p => {
                if (!prizeCounts[p]) prizeCounts[p] = 0;
                prizeCounts[p]++;
                
                const el = document.createElement('div');
                const uniqueId = `prize-${p}-${prizeCounts[p]}`;
                el.className = `prize-item ${p<=10000?'blue':p<=500000?'yellow':'red'}`;
                el.id = uniqueId; 
                el.textContent = formatMoney(p);
                
                // prize değeri -> element ID listesi
                if (!prizeElementMap[p]) prizeElementMap[p] = [];
                prizeElementMap[p].push(uniqueId);
                
                (p <= 10000 ? l : r).appendChild(el);
            });
        }
        function renderBoxes() {
            const g = document.getElementById('boxes-grid');
            g.innerHTML = '';
            for (let i = 1; i <= 22; i++) {
                const b = document.createElement('div');
                b.className = 'game-box';
                b.id = `box-${i}`;
                b.innerHTML = `<div class="box-number">${i}</div><div class="box-avatar">${avatars[i-1]}</div>`;
                b.onclick = () => handleBoxClick(i);
                g.appendChild(b);
            }
        }

        function formatMoney(n) { 
            return n.toLocaleString('tr-TR') + ' TL'; 
        }

        // Teklifi yuvarla - son iki hane 00 olsun
        function roundOffer(offer) {
            return Math.round(offer / 100) * 100;
        }

        function handleBoxClick(boxNum) {
            initAudio();
            
            if (!gameActive || openedBoxes.includes(boxNum)) return;

            if (playerBox === null) {
                playerBox = boxNum;
                document.getElementById(`box-${boxNum}`).classList.add('player-box');
                document.getElementById('player-box-num').textContent = boxNum;
                document.getElementById('stage-info').textContent = `1. Etap: ${stages[0]} kutu açın`;
                return;
            }

            if (boxNum === playerBox) {
                alert("Kendi kutunuzu açamazsınız!");
                return;
            }

            openBoxWithAnimation(boxNum);
        }

        function openBoxWithAnimation(boxNum) {
            const prize = boxContents[boxNum];
            const modal = document.getElementById('box-modal');
            const openingBox = document.getElementById('opening-box');
            const modalBoxNum = document.getElementById('modal-box-num');
            const revealedPrize = document.getElementById('revealed-prize');
            modalBoxNum.textContent = boxNum;
            revealedPrize.classList.remove('show');
            revealedPrize.textContent = formatMoney(prize);
            revealedPrize.style.color = (prize <= 10000) ? '#2196f3' : (prize <= 500000) ? '#ffc107' : '#f44336';

            modal.classList.add('show');
            openingBox.classList.add('opening');
            playDramSound();

            setTimeout(() => {
                revealedPrize.classList.add('show');
                setTimeout(() => {
                    if (prize <= 10000) playCelebration();
                    else playDisappointment();
                }, 500);

                setTimeout(() => {
                    modal.classList.remove('show');
                    openingBox.classList.remove('opening');
                    
                    openedBoxes.push(boxNum);
                    openedInCurrentStage++;
                    
                    const boxEl = document.getElementById(`box-${boxNum}`);
                    boxEl.classList.add('disabled');
                    boxEl.innerHTML = `<div style="font-size:0.7rem;color:var(--gold);">${formatMoney(prize)}</div>`;
                    
                    // Para ağacında bu ödülü soluklaştır (benzersiz ID kullanarak)
                    if (prizeElementMap[prize] && prizeElementMap[prize].length > 0) {
                        const elementId = prizeElementMap[prize].shift(); // İlk eşleşeni al ve listeden çıkar
                        const prizeEl = document.getElementById(elementId);
                        if (prizeEl) prizeEl.classList.add('opened');
                    }
                    
                    document.getElementById('boxes-remaining').textContent = 22 - openedBoxes.length;

                    if (openedInCurrentStage >= stages[currentStage]) {
                        gameActive = false;
                        setTimeout(() => showBankerOffer(), 800);
                    } else {
                        const rem = stages[currentStage] - openedInCurrentStage;
                        document.getElementById('stage-info').textContent = 
                            `${currentStage+1}. Etap: ${rem} kutu daha açın`;
                    }
                }, 2000);
            }, 1000);
        }

        // === BANKA TEKLİFİ - MANTIKLI VE YUVARLAK ===        function showBankerOffer() {
            const remaining = [];
            for (let p of prizes) {
                if (boxContents[playerBox] === p) {
                    remaining.push(p);
                    continue;
                }
                const isOpened = openedBoxes.some(b => boxContents[b] === p);
                if (!isOpened) {
                    remaining.push(p);
                }
            }
            
            if (remaining.length === 0) {
                openOwnBox();
                return;
            }
            
            const sum = remaining.reduce((a,b) => a + b, 0);
            const ev = sum / remaining.length;
            
            // MANTIKLI TEKLİF ÇARPANLARI:
            // Oyun başında düşük (kimse 500.000 TL kabul etmez)
            // Sona doğru artan
            const riskMultipliers = [0.20, 0.30, 0.40, 0.50, 0.60, 0.75, 0.90];
            const mult = riskMultipliers[currentStage] || 0.5;
            
            // Rastgelelik ekle (%-10 ile +%10 arası)
            const randomFactor = 0.9 + (Math.random() * 0.2);
            
            let offer = ev * mult * randomFactor;
            
            // Son iki hane 00 olacak şekilde yuvarla
            offer = roundOffer(offer);
            
            // Minimum teklif: kalan en küçük ödül
            offer = Math.max(offer, Math.min(...remaining));
            
            // Maksimum teklif: EV'nin %110'u (çok cömert olmasın)
            offer = Math.min(offer, Math.round(ev * 1.1 / 100) * 100);

            currentOffer = offer;

            playPhoneRing();
            
            setTimeout(() => {
                document.getElementById('banker-offer').textContent = formatMoney(currentOffer);
                document.getElementById('banker-modal').classList.add('show');
            }, 1200);
        }
        function acceptOffer() {
            document.getElementById('banker-modal').classList.remove('show');
            showResult(true);
        }

        function rejectOffer() {
            document.getElementById('banker-modal').classList.remove('show');
            lastOffer = currentOffer;
            document.getElementById('last-offer').textContent = formatMoney(lastOffer);
            currentStage++; 
            openedInCurrentStage = 0;
            
            if (currentStage >= stages.length) {
                setTimeout(openOwnBox, 500);
            } else {
                gameActive = true;
                document.getElementById('stage-info').textContent = 
                    `${currentStage+1}. Etap: ${stages[currentStage]} kutu açın`;
            }
        }

        function openOwnBox() {
            const prize = boxContents[playerBox];
            openBoxWithAnimation(playerBox);
            setTimeout(() => showResult(false), 3000);
        }

        function showResult(accepted) {
            const p = boxContents[playerBox];
            const f = accepted ? currentOffer : p;
            const m = document.getElementById('result-modal');
            m.classList.add('show');
            document.getElementById('result-amount').textContent = formatMoney(f);

            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-message');
            if (accepted) {
                title.textContent = p <= f ? '🎉 TEBRİKLER!' : '😔 SONUÇ';
                msg.innerHTML = `Banka teklifini kabul ettiniz.<br>Kutunuzda: ${formatMoney(p)} vardı.`;
                document.getElementById('result-amount').style.color = f >= p ? '#4caf50' : '#ff9800';
                if (f >= p) startFireworks();
            } else {
                if (p >= 100000) {
                    title.textContent = '🎆 MUHTEŞEM!';
                    msg.innerHTML = `Kutunuzdan büyük ödül çıktı!<br>Harika bir oyun çıkardınız!`;
                    document.getElementById('result-amount').style.color = '#4caf50';
                    startFireworks();
                } else if (p >= 10000) {
                    title.textContent = '😐 SONUÇ';                    msg.innerHTML = `Kutunuzdan orta seviye ödül çıktı.<br>${formatMoney(p)} kazandınız.`;
                    document.getElementById('result-amount').style.color = '#ffc107';
                } else {
                    title.textContent = '😢 ÜZÜCÜ';
                    msg.innerHTML = `Kutunuzdan küçük ödül çıktı.<br>Banka teklifini (${formatMoney(currentOffer)}) reddetmiştiniz.`;
                    document.getElementById('result-amount').style.color = '#f44336';
                    playDisappointment();
                }
            }

            for (let i = 1; i <= 22; i++) {
                if (!openedBoxes.includes(i)) {
                    const el = document.getElementById(`box-${i}`);
                    el.innerHTML = `<div style="font-size:0.65rem;color:var(--gold);">${formatMoney(boxContents[i])}</div>`;
                }
            }
        }

        window.addEventListener('load', () => {
            console.log("Sayfa yüklendi");
        });
    </script>
</body>
</html>
